<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110" shape-rendering="crispEdges">
  <style>
    .btn-bg { fill: #ffffff; }
    .btn-border { fill: #0d0d18; }
    .btn-text { font-family: 'DungGeunMo', 'Galmuri11', monospace, sans-serif; font-weight: 900; fill: #0d0d18; font-size: 42px; text-anchor: middle; letter-spacing: 2px; }
  </style>
  
  <!-- Outer Rounded Pixel Border -->
  <!-- Top & Bottom edges -->
  <rect x="30" y="5" width="320" height="8" class="btn-border"/>
  <rect x="30" y="97" width="320" height="8" class="btn-border"/>
  <!-- Left & Right edges -->
  <rect x="5" y="30" width="8" height="50" class="btn-border"/>
  <rect x="367" y="30" width="8" height="50" class="btn-border"/>
  <!-- Corners -->
  <rect x="18" y="13" width="14" height="8" class="btn-border"/>
  <rect x="10" y="21" width="10" height="10" class="btn-border"/>
  
  <rect x="348" y="13" width="14" height="8" class="btn-border"/>
  <rect x="360" y="21" width="10" height="10" class="btn-border"/>

  <rect x="18" y="89" width="14" height="8" class="btn-border"/>
  <rect x="10" y="79" width="10" height="10" class="btn-border"/>

  <rect x="348" y="89" width="14" height="8" class="btn-border"/>
  <rect x="360" y="79" width="10" height="10" class="btn-border"/>

  <!-- Inner Fill -->
  <rect x="13" y="13" width="354" height="84" class="btn-bg" rx="12"/>

  <!-- Button Text -->
  <text x="190" y="68" class="btn-text">게임 시작하기</text>
</svg>
